<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <defs>
    <pattern id="dotsU" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.7" fill="white" opacity="0.05"/>
    </pattern>
    <linearGradient id="bgU" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05050f"/>
      <stop offset="100%" stop-color="#080c1e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" fill="url(#bgU)"/>
  <rect width="800" height="220" fill="url(#dotsU)"/>

  <!-- Glows -->
  <ellipse cx="250" cy="100" rx="200" ry="80" fill="#6366f1" opacity="0.05"/>
  <ellipse cx="620" cy="120" rx="140" ry="60" fill="#06b6d4" opacity="0.04"/>

  <!-- Long URL input -->
  <rect x="30" y="80" width="270" height="36" rx="18" fill="#6366f1" opacity="0.08" stroke="#6366f1" stroke-width="1.2"/>
  <text x="48" y="94" font-family="monospace" font-size="7" fill="#818cf8" opacity="0.9">https://www.example.com/very/long/path</text>
  <text x="48" y="107" font-family="monospace" font-size="7" fill="#818cf8" opacity="0.6">?utm_source=email&amp;utm_campaign=spring</text>

  <!-- Arrow -->
  <line x1="314" y1="98" x2="356" y2="98" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="356,93 366,98 356,103" fill="#6366f1" opacity="0.5"/>

  <!-- Core service box -->
  <rect x="372" y="52" width="115" height="92" rx="8" fill="#6366f1" opacity="0.08" stroke="#6366f1" stroke-width="1.5"/>
  <text x="429" y="74" font-family="monospace" font-size="9" fill="#818cf8" text-anchor="middle" font-weight="600">URLY</text>
  <line x1="382" y1="82" x2="477" y2="82" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="429" y="94" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.4">nanoid · 7 chars</text>
  <text x="429" y="106" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.35">Zod validation</text>
  <text x="429" y="118" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.3">Hexagonal arch</text>
  <text x="429" y="130" font-family="monospace" font-size="6.5" fill="#6366f1" text-anchor="middle" opacity="0.5">Node.js · Express</text>

  <!-- Short URL output -->
  <line x1="489" y1="98" x2="530" y2="98" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="530,93 540,98 530,103" fill="#6366f1" opacity="0.5"/>
  <rect x="546" y="80" width="160" height="36" rx="18" fill="#6366f1" opacity="0.12" stroke="#6366f1" stroke-width="1.5"/>
  <text x="626" y="97" font-family="monospace" font-size="11" fill="#818cf8" text-anchor="middle" font-weight="700">urly.io/aB3kR9w</text>
  <text x="626" y="110" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.35">301 redirect · tracked</text>

  <!-- Redis cache -->
  <rect x="370" y="165" width="120" height="30" rx="5" fill="#f87171" opacity="0.08" stroke="#f87171" stroke-width="1"/>
  <text x="430" y="180" font-family="monospace" font-size="8" fill="#f87171" text-anchor="middle" font-weight="600">Redis Cache</text>
  <text x="430" y="191" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.35">1h TTL redirect · 5min stats</text>
  <!-- Arrow from service to redis -->
  <line x1="429" y1="145" x2="429" y2="163" stroke="#f87171" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3,2"/>

  <!-- Stats badge -->
  <rect x="546" y="132" width="160" height="60" rx="6" fill="#06b6d4" opacity="0.06" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="626" y="150" font-family="monospace" font-size="8" fill="#06b6d4" text-anchor="middle">Analytics</text>
  <line x1="556" y1="156" x2="696" y2="156" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.15"/>
  <text x="626" y="167" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.4">clicks · referrer · geo</text>
  <text x="626" y="178" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.3">rate limit: 100/15min</text>
  <text x="626" y="188" font-family="monospace" font-size="6" fill="#06b6d4" text-anchor="middle" opacity="0.4">Helmet · Pino · Zod</text>

  <!-- Top label -->
  <text x="32" y="30" font-family="sans-serif" font-size="10" fill="#6366f1" opacity="0.7" font-weight="600" letter-spacing="2">BACKEND · URL SHORTENER · NODE.JS + REDIS</text>

  <!-- Auth badge -->
  <rect x="30" y="138" width="120" height="28" rx="5" fill="#6366f1" opacity="0.08" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="90" y="152" font-family="monospace" font-size="7.5" fill="#818cf8" text-anchor="middle">JWT · auth routes</text>
  <text x="90" y="162" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.3">10 links/15min</text>
</svg>
