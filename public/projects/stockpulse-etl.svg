<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <defs>
    <pattern id="g3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="white" stroke-width="0.4" opacity="0.04"/>
    </pattern>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a0e"/>
      <stop offset="100%" stop-color="#0a1a28"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" fill="url(#bg3)"/>
  <rect width="800" height="220" fill="url(#g3)"/>

  <!-- Glows -->
  <ellipse cx="180" cy="110" rx="130" ry="70" fill="#22c55e" opacity="0.04"/>
  <ellipse cx="590" cy="110" rx="160" ry="80" fill="#06b6d4" opacity="0.04"/>

  <!-- Pipeline (left side) -->
  <!-- Redpanda -->
  <rect x="30" y="72" width="110" height="36" rx="6" fill="#f97316" opacity="0.1" stroke="#f97316" stroke-width="1.2"/>
  <text x="85" y="87" font-family="monospace" font-size="9" fill="#fb923c" text-anchor="middle" font-weight="600">Redpanda</text>
  <text x="85" y="100" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.4">3 partitions · KRaft</text>

  <!-- Tick events label -->
  <text x="85" y="60" font-family="monospace" font-size="7" fill="#ffffff" opacity="0.3" text-anchor="middle">stock.ticks.v1</text>
  <line x1="85" y1="63" x2="85" y2="71" stroke="#f97316" stroke-width="0.8" opacity="0.3"/>

  <!-- Arrow down -->
  <line x1="85" y1="109" x2="85" y2="130" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
  <polygon points="80,130 85,140 90,130" fill="#22c55e" opacity="0.5"/>

  <!-- Consumer -->
  <rect x="30" y="141" width="110" height="30" rx="6" fill="#22c55e" opacity="0.1" stroke="#22c55e" stroke-width="1.2"/>
  <text x="85" y="157" font-family="monospace" font-size="8.5" fill="#4ade80" text-anchor="middle" font-weight="600">Consumer</text>
  <text x="85" y="169" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.4">OHLCV aggregation</text>

  <!-- Arrow right -->
  <line x1="141" y1="155" x2="175" y2="155" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
  <polygon points="175,150 185,155 175,160" fill="#06b6d4" opacity="0.5"/>

  <!-- Postgres dual tables -->
  <rect x="190" y="125" width="115" height="60" rx="6" fill="#06b6d4" opacity="0.07" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="247" y="143" font-family="monospace" font-size="8.5" fill="#06b6d4" text-anchor="middle" font-weight="600">PostgreSQL</text>
  <line x1="200" y1="149" x2="295" y2="149" stroke="#06b6d4" stroke-width="0.5" opacity="0.2"/>
  <text x="247" y="160" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.4">raw ticks + aggregates</text>
  <text x="247" y="172" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.35">ON CONFLICT · idempotent</text>
  <text x="247" y="183" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.25">SHA256 dedup</text>

  <!-- Arrow right to FastAPI -->
  <line x1="306" y1="155" x2="340" y2="155" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>
  <polygon points="340,150 350,155 340,160" fill="#8b5cf6" opacity="0.5"/>

  <!-- FastAPI -->
  <rect x="355" y="136" width="90" height="38" rx="6" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="400" y="153" font-family="monospace" font-size="8.5" fill="#a78bfa" text-anchor="middle" font-weight="600">FastAPI</text>
  <text x="400" y="166" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.4">/stats/:symbol</text>

  <!-- Candlestick chart (right side) -->
  <!-- Chart area -->
  <rect x="460" y="40" width="310" height="155" rx="6" fill="#000000" opacity="0.2" stroke="#22c55e" stroke-width="0.8" opacity="0.3"/>

  <!-- Grid lines -->
  <line x1="460" y1="88" x2="770" y2="88" stroke="#22c55e" stroke-width="0.4" opacity="0.15"/>
  <line x1="460" y1="120" x2="770" y2="120" stroke="#22c55e" stroke-width="0.4" opacity="0.15"/>
  <line x1="460" y1="152" x2="770" y2="152" stroke="#22c55e" stroke-width="0.4" opacity="0.15"/>

  <!-- Candles - green (bullish) and red (bearish) -->
  <!-- Candle 1 - green -->
  <line x1="490" y1="72" x2="490" y2="165" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
  <rect x="484" y="90" width="12" height="55" rx="1" fill="#4ade80" opacity="0.7"/>
  <!-- Candle 2 - red -->
  <line x1="520" y1="68" x2="520" y2="155" stroke="#f87171" stroke-width="1" opacity="0.5"/>
  <rect x="514" y="85" width="12" height="50" rx="1" fill="#f87171" opacity="0.7"/>
  <!-- Candle 3 - green -->
  <line x1="550" y1="75" x2="550" y2="160" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
  <rect x="544" y="92" width="12" height="48" rx="1" fill="#4ade80" opacity="0.7"/>
  <!-- Candle 4 - green -->
  <line x1="580" y1="62" x2="580" y2="148" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
  <rect x="574" y="78" width="12" height="52" rx="1" fill="#4ade80" opacity="0.7"/>
  <!-- Candle 5 - red -->
  <line x1="610" y1="70" x2="610" y2="158" stroke="#f87171" stroke-width="1" opacity="0.5"/>
  <rect x="604" y="90" width="12" height="44" rx="1" fill="#f87171" opacity="0.7"/>
  <!-- Candle 6 - green -->
  <line x1="640" y1="65" x2="640" y2="150" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
  <rect x="634" y="78" width="12" height="52" rx="1" fill="#4ade80" opacity="0.7"/>
  <!-- Candle 7 - green -->
  <line x1="670" y1="58" x2="670" y2="140" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
  <rect x="664" y="70" width="12" height="55" rx="1" fill="#4ade80" opacity="0.7"/>
  <!-- Candle 8 - red -->
  <line x1="700" y1="68" x2="700" y2="155" stroke="#f87171" stroke-width="1" opacity="0.5"/>
  <rect x="694" y="85" width="12" height="48" rx="1" fill="#f87171" opacity="0.7"/>
  <!-- Candle 9 - green -->
  <line x1="730" y1="55" x2="730" y2="142" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
  <rect x="724" y="68" width="12" height="56" rx="1" fill="#4ade80" opacity="0.7"/>
  <!-- Candle 10 - green -->
  <line x1="760" y1="48" x2="760" y2="135" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
  <rect x="754" y="60" width="12" height="58" rx="1" fill="#4ade80" opacity="0.7"/>

  <!-- OHLCV label -->
  <text x="615" y="200" font-family="monospace" font-size="8" fill="#22c55e" text-anchor="middle" opacity="0.6">OHLCV · 1-minute bars</text>

  <!-- Top label -->
  <text x="32" y="24" font-family="sans-serif" font-size="10" fill="#22c55e" opacity="0.7" font-weight="600" letter-spacing="2">DATA ENGINEERING · STREAMING · REDPANDA</text>

  <!-- Batch backfill badge -->
  <rect x="190" y="72" width="115" height="22" rx="4" fill="#f97316" opacity="0.08" stroke="#f97316" stroke-width="0.8" opacity="0.4"/>
  <text x="247" y="86" font-family="monospace" font-size="7.5" fill="#fb923c" text-anchor="middle" opacity="0.7">batch backfill · SHA256</text>
</svg>
