<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <defs>
    <pattern id="gridSP" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="white" stroke-width="0.4" opacity="0.04"/>
    </pattern>
    <linearGradient id="bgSP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#150800"/>
      <stop offset="100%" stop-color="#1a0c00"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" fill="url(#bgSP)"/>
  <rect width="800" height="220" fill="url(#gridSP)"/>

  <!-- Glows -->
  <ellipse cx="200" cy="110" rx="160" ry="80" fill="#f97316" opacity="0.05"/>
  <ellipse cx="590" cy="110" rx="140" ry="70" fill="#06b6d4" opacity="0.04"/>

  <!-- Kafka box -->
  <rect x="30" y="60" width="120" height="100" rx="6" fill="#f97316" opacity="0.08" stroke="#f97316" stroke-width="1.2"/>
  <text x="90" y="80" font-family="monospace" font-size="9" fill="#fb923c" text-anchor="middle" font-weight="600">Kafka</text>
  <text x="90" y="93" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.35">3.7 KRaft</text>
  <!-- Partition lanes -->
  <line x1="40" y1="103" x2="140" y2="103" stroke="#f97316" stroke-width="0.5" opacity="0.2"/>
  <text x="54" y="117" font-family="monospace" font-size="6.5" fill="#fb923c" opacity="0.7">P0</text>
  <!-- Event dots -->
  <circle cx="72"  cy="114" r="4" fill="#f97316" opacity="0.7"/>
  <circle cx="88"  cy="114" r="4" fill="#f97316" opacity="0.5"/>
  <circle cx="104" cy="114" r="4" fill="#f97316" opacity="0.3"/>
  <line x1="40" y1="126" x2="140" y2="126" stroke="#f97316" stroke-width="0.5" opacity="0.15"/>
  <text x="54" y="138" font-family="monospace" font-size="6.5" fill="#fb923c" opacity="0.5">P1</text>
  <circle cx="80"  cy="136" r="4" fill="#f97316" opacity="0.5"/>
  <circle cx="96"  cy="136" r="4" fill="#f97316" opacity="0.3"/>
  <line x1="40" y1="148" x2="140" y2="148" stroke="#f97316" stroke-width="0.5" opacity="0.1"/>
  <text x="54" y="160" font-family="monospace" font-size="6.5" fill="#fb923c" opacity="0.35">P2</text>
  <circle cx="76"  cy="156" r="4" fill="#f97316" opacity="0.3"/>

  <!-- Topic label -->
  <text x="90" y="177" font-family="monospace" font-size="6.5" fill="#f97316" text-anchor="middle" opacity="0.5">click-events · 3 partitions</text>

  <!-- Arrow -->
  <line x1="153" y1="110" x2="190" y2="110" stroke="#f97316" stroke-width="1.5" opacity="0.5"/>
  <polygon points="190,105 200,110 190,115" fill="#f97316" opacity="0.5"/>

  <!-- Consumer / Aggregator -->
  <rect x="205" y="82" width="110" height="56" rx="6" fill="#f59e0b" opacity="0.07" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="260" y="103" font-family="monospace" font-size="8.5" fill="#fbbf24" text-anchor="middle" font-weight="600">Consumer</text>
  <text x="260" y="116" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.4">click aggregation</text>
  <text x="260" y="128" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.3">session grouping</text>

  <!-- Arrow to Postgres -->
  <line x1="317" y1="110" x2="356" y2="110" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
  <polygon points="356,105 366,110 356,115" fill="#06b6d4" opacity="0.5"/>

  <!-- PostgreSQL dual tables -->
  <rect x="370" y="55" width="130" height="110" rx="6" fill="#06b6d4" opacity="0.06" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="435" y="75" font-family="monospace" font-size="8.5" fill="#06b6d4" text-anchor="middle" font-weight="600">PostgreSQL</text>
  <line x1="380" y1="82" x2="490" y2="82" stroke="#06b6d4" stroke-width="0.5" opacity="0.2"/>
  <!-- Table 1 -->
  <rect x="382" y="88" width="106" height="32" rx="3" fill="#06b6d4" opacity="0.08"/>
  <text x="435" y="101" font-family="monospace" font-size="7" fill="#67e8f9" text-anchor="middle" opacity="0.9">click_events</text>
  <text x="435" y="112" font-family="monospace" font-size="6" fill="#ffffff" text-anchor="middle" opacity="0.35">raw · session · ts</text>
  <!-- Table 2 -->
  <rect x="382" y="126" width="106" height="32" rx="3" fill="#06b6d4" opacity="0.06"/>
  <text x="435" y="139" font-family="monospace" font-size="7" fill="#67e8f9" text-anchor="middle" opacity="0.8">click_aggregates</text>
  <text x="435" y="150" font-family="monospace" font-size="6" fill="#ffffff" text-anchor="middle" opacity="0.3">ON CONFLICT UPSERT</text>

  <!-- Arrow to API -->
  <line x1="502" y1="110" x2="540" y2="110" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>
  <polygon points="540,105 550,110 540,115" fill="#8b5cf6" opacity="0.5"/>

  <!-- TypeScript API -->
  <rect x="555" y="82" width="105" height="56" rx="6" fill="#8b5cf6" opacity="0.08" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="607" y="103" font-family="monospace" font-size="8.5" fill="#a78bfa" text-anchor="middle" font-weight="600">Analytics API</text>
  <text x="607" y="116" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.4">TypeScript</text>
  <text x="607" y="128" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.3">/stats · /sessions</text>

  <!-- Dashboard icon -->
  <rect x="680" y="68" width="100" height="84" rx="6" fill="#10b981" opacity="0.06" stroke="#10b981" stroke-width="0.8" opacity="0.4"/>
  <text x="730" y="85" font-family="monospace" font-size="8" fill="#34d399" text-anchor="middle" opacity="0.8">Dashboard</text>
  <!-- Mini chart -->
  <line x1="693" y1="140" x2="767" y2="140" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
  <polyline points="695,135 705,125 715,130 725,115 735,120 745,105 755,108 765,95" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
  <text x="730" y="148" font-family="monospace" font-size="6.5" fill="#34d399" text-anchor="middle" opacity="0.5">click trends</text>

  <!-- Top label -->
  <text x="32" y="26" font-family="sans-serif" font-size="10" fill="#f97316" opacity="0.7" font-weight="600" letter-spacing="2">DATA ENGINEERING · STREAMING · KAFKA + TYPESCRIPT</text>
</svg>
