<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="white" stroke-width="0.4" opacity="0.04"/>
    </pattern>
    <linearGradient id="bgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0510"/>
      <stop offset="100%" stop-color="#0f0518"/>
    </linearGradient>
    <radialGradient id="brainGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="220" fill="url(#bgb)"/>
  <rect width="800" height="220" fill="url(#grid)"/>

  <!-- Brain glow -->
  <ellipse cx="280" cy="115" rx="180" ry="100" fill="url(#brainGlow)"/>

  <!-- MRI scan frame -->
  <rect x="60" y="35" width="180" height="150" rx="4" fill="#000000" opacity="0.4" stroke="#f43f5e" stroke-width="1" opacity="0.4"/>
  <!-- Brain silhouette (simplified) -->
  <ellipse cx="150" cy="105" rx="72" ry="62" fill="#1a0a12" stroke="#f43f5e" stroke-width="0.8" opacity="0.5"/>
  <!-- Brain folds lines -->
  <path d="M110 88 Q130 78 150 85 Q170 92 185 84" fill="none" stroke="#f43f5e" stroke-width="0.8" opacity="0.3"/>
  <path d="M100 105 Q120 96 140 100 Q160 104 175 96" fill="none" stroke="#f43f5e" stroke-width="0.8" opacity="0.25"/>
  <path d="M108 122 Q128 114 148 118 Q168 122 183 115" fill="none" stroke="#f43f5e" stroke-width="0.8" opacity="0.2"/>
  <!-- Tumor region (highlighted) -->
  <ellipse cx="170" cy="88" rx="18" ry="15" fill="#f43f5e" opacity="0.25"/>
  <!-- Bounding box -->
  <rect x="148" y="70" width="44" height="36" rx="2" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.9"/>
  <!-- Corner marks -->
  <line x1="148" y1="70" x2="156" y2="70" stroke="#fbbf24" stroke-width="2"/>
  <line x1="148" y1="70" x2="148" y2="78" stroke="#fbbf24" stroke-width="2"/>
  <line x1="192" y1="70" x2="184" y2="70" stroke="#fbbf24" stroke-width="2"/>
  <line x1="192" y1="70" x2="192" y2="78" stroke="#fbbf24" stroke-width="2"/>
  <line x1="148" y1="106" x2="156" y2="106" stroke="#fbbf24" stroke-width="2"/>
  <line x1="148" y1="106" x2="148" y2="98" stroke="#fbbf24" stroke-width="2"/>
  <line x1="192" y1="106" x2="184" y2="106" stroke="#fbbf24" stroke-width="2"/>
  <line x1="192" y1="106" x2="192" y2="98" stroke="#fbbf24" stroke-width="2"/>
  <!-- Confidence label -->
  <rect x="145" y="108" width="60" height="14" rx="2" fill="#f43f5e" opacity="0.85"/>
  <text x="175" y="119" font-family="monospace" font-size="7.5" fill="#ffffff" text-anchor="middle" font-weight="600">tumor 0.94</text>
  <!-- Scan lines -->
  <text x="150" y="175" font-family="monospace" font-size="8" fill="#ffffff" opacity="0.3" text-anchor="middle">MRI SCAN</text>

  <!-- Arrow -->
  <line x1="254" y1="110" x2="295" y2="110" stroke="#f43f5e" stroke-width="1.5" opacity="0.5"/>
  <polygon points="295,105 305,110 295,115" fill="#f43f5e" opacity="0.5"/>

  <!-- YOLOv8 box -->
  <rect x="315" y="76" width="120" height="68" rx="6" fill="#f43f5e" opacity="0.07" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="375" y="98" font-family="monospace" font-size="10" fill="#fb7185" text-anchor="middle" font-weight="600">YOLOv8</text>
  <line x1="325" y1="105" x2="425" y2="105" stroke="#f43f5e" stroke-width="0.5" opacity="0.2"/>
  <text x="375" y="117" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.4">object detection</text>
  <text x="375" y="129" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.35">custom trained</text>
  <text x="375" y="141" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.3">Roboflow dataset</text>

  <!-- Metrics boxes -->
  <rect x="465" y="56" width="90" height="40" rx="5" fill="#f43f5e" opacity="0.08" stroke="#f43f5e" stroke-width="0.8"/>
  <text x="510" y="72" font-family="monospace" font-size="8" fill="#fb7185" text-anchor="middle">Precision</text>
  <text x="510" y="88" font-family="monospace" font-size="13" fill="#f43f5e" text-anchor="middle" font-weight="700">94.2%</text>

  <rect x="465" y="108" width="90" height="40" rx="5" fill="#f43f5e" opacity="0.08" stroke="#f43f5e" stroke-width="0.8"/>
  <text x="510" y="124" font-family="monospace" font-size="8" fill="#fb7185" text-anchor="middle">Recall</text>
  <text x="510" y="140" font-family="monospace" font-size="13" fill="#f43f5e" text-anchor="middle" font-weight="700">91.8%</text>

  <rect x="575" y="82" width="90" height="40" rx="5" fill="#8b5cf6" opacity="0.08" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="620" y="98" font-family="monospace" font-size="8" fill="#a78bfa" text-anchor="middle">mAP@0.5</text>
  <text x="620" y="114" font-family="monospace" font-size="13" fill="#8b5cf6" text-anchor="middle" font-weight="700">93.1%</text>

  <!-- Classes badge -->
  <rect x="575" y="140" width="90" height="22" rx="4" fill="#06b6d4" opacity="0.08" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="620" y="155" font-family="monospace" font-size="7.5" fill="#06b6d4" text-anchor="middle" opacity="0.8">3 classes · 800 imgs</text>

  <!-- Flask badge -->
  <rect x="695" y="94" width="82" height="30" rx="4" fill="#ffffff" opacity="0.04" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
  <text x="736" y="107" font-family="monospace" font-size="7.5" fill="#ffffff" text-anchor="middle" opacity="0.5">Flask · REST API</text>
  <text x="736" y="118" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.3">heatmap overlay</text>

  <!-- Top label -->
  <text x="32" y="24" font-family="sans-serif" font-size="10" fill="#f43f5e" opacity="0.7" font-weight="600" letter-spacing="2">COMPUTER VISION · YOLOV8 · MEDICAL AI</text>
</svg>
