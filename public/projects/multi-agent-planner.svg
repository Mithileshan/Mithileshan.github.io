<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="white" opacity="0.06"/>
    </pattern>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0a1e"/>
      <stop offset="100%" stop-color="#0f1428"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" fill="url(#bg2)"/>
  <rect width="800" height="220" fill="url(#dots)"/>

  <!-- Glows -->
  <ellipse cx="260" cy="55" rx="90" ry="40" fill="#8b5cf6" opacity="0.06"/>
  <ellipse cx="260" cy="165" rx="90" ry="40" fill="#06b6d4" opacity="0.05"/>
  <ellipse cx="540" cy="110" rx="80" ry="50" fill="#8b5cf6" opacity="0.05"/>

  <!-- SSE stream (right side) -->
  <text x="690" y="36" font-family="monospace" font-size="7.5" fill="#06b6d4" opacity="0.5">SSE stream</text>
  <text x="680" y="52" font-family="monospace" font-size="6.5" fill="#ffffff" opacity="0.25">run.started</text>
  <text x="680" y="65" font-family="monospace" font-size="6.5" fill="#a78bfa" opacity="0.35">planner.delta</text>
  <text x="680" y="78" font-family="monospace" font-size="6.5" fill="#f59e0b" opacity="0.35">critic.completed</text>
  <text x="680" y="91" font-family="monospace" font-size="6.5" fill="#10b981" opacity="0.35">judge.completed</text>
  <text x="680" y="104" font-family="monospace" font-size="6.5" fill="#ffffff" opacity="0.25">plan.awaiting_approval</text>
  <text x="680" y="117" font-family="monospace" font-size="6.5" fill="#06b6d4" opacity="0.35">executor.step.delta</text>
  <text x="680" y="130" font-family="monospace" font-size="6.5" fill="#ffffff" opacity="0.25">run.completed</text>
  <!-- Vertical line for stream -->
  <line x1="672" y1="30" x2="672" y2="140" stroke="#06b6d4" stroke-width="0.8" opacity="0.2"/>

  <!-- PLANNER node -->
  <circle cx="260" cy="52" r="32" fill="#8b5cf6" opacity="0.12" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="260" y="48" font-family="monospace" font-size="9" fill="#a78bfa" text-anchor="middle" font-weight="600">PLANNER</text>
  <text x="260" y="61" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.35">max 10 steps</text>

  <!-- Arrow: Planner → Critic L -->
  <line x1="235" y1="82" x2="180" y2="128" stroke="#8b5cf6" stroke-width="1.2" opacity="0.4"/>
  <polygon points="178,121 174,132 185,128" fill="#8b5cf6" opacity="0.4"/>
  <!-- Arrow: Planner → Critic R -->
  <line x1="285" y1="82" x2="340" y2="128" stroke="#8b5cf6" stroke-width="1.2" opacity="0.4"/>
  <polygon points="342,121 346,132 335,128" fill="#8b5cf6" opacity="0.4"/>

  <!-- CRITIC nodes -->
  <circle cx="160" cy="148" r="28" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="160" y="144" font-family="monospace" font-size="8" fill="#fbbf24" text-anchor="middle" font-weight="600">CRITIC</text>
  <text x="160" y="156" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.4">logic</text>

  <circle cx="360" cy="148" r="28" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="360" y="144" font-family="monospace" font-size="8" fill="#fbbf24" text-anchor="middle" font-weight="600">CRITIC</text>
  <text x="360" y="156" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.4">evidence</text>

  <!-- Arrows: Critics → Judge -->
  <line x1="185" y1="168" x2="238" y2="188" stroke="#10b981" stroke-width="1.2" opacity="0.4"/>
  <line x1="335" y1="168" x2="282" y2="188" stroke="#10b981" stroke-width="1.2" opacity="0.4"/>
  <polygon points="236,181 240,192 248,185" fill="#10b981" opacity="0.4"/>
  <polygon points="284,181 280,192 272,185" fill="#10b981" opacity="0.4"/>

  <!-- JUDGE node -->
  <circle cx="260" cy="200" r="18" fill="#10b981" opacity="0.12" stroke="#10b981" stroke-width="1.2"/>
  <text x="260" y="204" font-family="monospace" font-size="8" fill="#34d399" text-anchor="middle" font-weight="600">JUDGE</text>

  <!-- Arrow: Judge → Executor -->
  <line x1="278" y1="200" x2="440" y2="170" stroke="#06b6d4" stroke-width="1.2" opacity="0.4"/>
  <polygon points="435,164 444,168 437,176" fill="#06b6d4" opacity="0.4"/>

  <!-- EXECUTOR node -->
  <rect x="450" y="100" width="110" height="70" rx="8" fill="#06b6d4" opacity="0.08" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="505" y="125" font-family="monospace" font-size="9" fill="#06b6d4" text-anchor="middle" font-weight="600">EXECUTOR</text>
  <text x="505" y="140" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.35">bounded · no new goals</text>
  <text x="505" y="153" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.35">sequential steps</text>
  <text x="505" y="166" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.35">citations per step</text>

  <!-- Cost guard badge -->
  <rect x="450" y="55" width="110" height="36" rx="5" fill="#ef4444" opacity="0.08" stroke="#ef4444" stroke-width="1"/>
  <text x="505" y="70" font-family="monospace" font-size="8" fill="#f87171" text-anchor="middle">cost guard</text>
  <text x="505" y="83" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.35">$0.05/run · reject if over</text>
  <!-- Arrow: cost guard to executor -->
  <line x1="505" y1="91" x2="505" y2="99" stroke="#ef4444" stroke-width="1" opacity="0.3"/>

  <!-- pgvector badge -->
  <rect x="25" y="25" width="90" height="22" rx="4" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-width="0.8" opacity="0.4"/>
  <text x="70" y="40" font-family="monospace" font-size="7.5" fill="#a78bfa" text-anchor="middle" opacity="0.8">pgvector · top-12</text>
  <text x="33" y="210" font-family="monospace" font-size="7.5" fill="#ffffff" opacity="0.25">MAX_REVISION_ROUNDS=1</text>

  <!-- Top label -->
  <text x="32" y="16" font-family="sans-serif" font-size="10" fill="#8b5cf6" opacity="0.7" font-weight="600" letter-spacing="2">AI SYSTEMS · MULTI-AGENT · LANGGRAPH</text>
</svg>
