<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <defs>
    <pattern id="dotsC" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.7" fill="white" opacity="0.05"/>
    </pattern>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#011208"/>
      <stop offset="100%" stop-color="#031a10"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" fill="url(#bgC)"/>
  <rect width="800" height="220" fill="url(#dotsC)"/>

  <!-- Glows -->
  <ellipse cx="260" cy="110" rx="220" ry="90" fill="#34d399" opacity="0.04"/>
  <ellipse cx="620" cy="110" rx="120" ry="60" fill="#34d399" opacity="0.03"/>

  <!-- Chat UI frame -->
  <rect x="30" y="35" width="530" height="155" rx="8" fill="#000000" opacity="0.25" stroke="#34d399" stroke-width="0.8" opacity="0.25"/>

  <!-- Header bar -->
  <rect x="30" y="35" width="530" height="28" rx="8" fill="#34d399" opacity="0.08"/>
  <circle cx="50" cy="49" r="5" fill="#34d399" opacity="0.6"/>
  <text x="64" y="53" font-family="monospace" font-size="8" fill="#34d399" opacity="0.8"># general · 4 online</text>
  <!-- Dot indicators -->
  <circle cx="530" cy="49" r="4" fill="#34d399" opacity="0.7"/>
  <circle cx="518" cy="49" r="4" fill="#fbbf24" opacity="0.5"/>
  <circle cx="506" cy="49" r="4" fill="#f87171" opacity="0.4"/>

  <!-- Message bubbles: User A (left) -->
  <rect x="46" y="76" width="180" height="28" rx="12" rx="2" fill="#34d399" opacity="0.12" stroke="#34d399" stroke-width="0.6" opacity="0.4"/>
  <text x="58" y="88" font-family="monospace" font-size="7.5" fill="#6ee7b7" opacity="0.9">Hey, anyone free for standup?</text>
  <text x="58" y="99" font-family="monospace" font-size="6" fill="#ffffff" opacity="0.3">userA · 10:02 AM</text>

  <!-- Message bubbles: User B (right) -->
  <rect x="314" y="76" width="230" height="28" rx="2" fill="#06b6d4" opacity="0.1" stroke="#06b6d4" stroke-width="0.6" opacity="0.4"/>
  <text x="326" y="88" font-family="monospace" font-size="7.5" fill="#67e8f9" opacity="0.9">Yeah, join the standup room!</text>
  <text x="326" y="99" font-family="monospace" font-size="6" fill="#ffffff" opacity="0.3">userB · 10:03 AM</text>

  <!-- Message bubbles: User A -->
  <rect x="46" y="115" width="200" height="28" rx="2" fill="#34d399" opacity="0.1" stroke="#34d399" stroke-width="0.6" opacity="0.3"/>
  <text x="58" y="127" font-family="monospace" font-size="7.5" fill="#6ee7b7" opacity="0.8">On my way! Sharing my screen.</text>
  <text x="58" y="138" font-family="monospace" font-size="6" fill="#ffffff" opacity="0.25">userA · 10:04 AM</text>

  <!-- Message bubbles: User C -->
  <rect x="314" y="115" width="238" height="28" rx="2" fill="#8b5cf6" opacity="0.08" stroke="#8b5cf6" stroke-width="0.6" opacity="0.3"/>
  <text x="326" y="127" font-family="monospace" font-size="7.5" fill="#a78bfa" opacity="0.8">Joining now ✓</text>
  <text x="326" y="138" font-family="monospace" font-size="6" fill="#ffffff" opacity="0.25">userC · 10:04 AM</text>

  <!-- Input box -->
  <rect x="46" y="157" width="500" height="22" rx="4" fill="#34d399" opacity="0.04" stroke="#34d399" stroke-width="0.5" opacity="0.2"/>
  <text x="58" y="171" font-family="monospace" font-size="7" fill="#ffffff" opacity="0.2">Message #general...</text>

  <!-- Socket.IO badge -->
  <rect x="578" y="52" width="100" height="30" rx="5" fill="#34d399" opacity="0.1" stroke="#34d399" stroke-width="1"/>
  <text x="628" y="67" font-family="monospace" font-size="8" fill="#34d399" text-anchor="middle" font-weight="600">Socket.IO</text>
  <text x="628" y="78" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.4">real-time · WS</text>

  <!-- Redis badge -->
  <rect x="578" y="94" width="100" height="30" rx="5" fill="#f87171" opacity="0.08" stroke="#f87171" stroke-width="0.8"/>
  <text x="628" y="109" font-family="monospace" font-size="8" fill="#f87171" text-anchor="middle" font-weight="600">Redis</text>
  <text x="628" y="120" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.35">pub/sub adapter</text>

  <!-- Rate limit badge -->
  <rect x="578" y="136" width="100" height="30" rx="5" fill="#f59e0b" opacity="0.07" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="628" y="151" font-family="monospace" font-size="7.5" fill="#fbbf24" text-anchor="middle">Rate Limit</text>
  <text x="628" y="162" font-family="monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" opacity="0.35">100/15min</text>

  <!-- Rooms stat -->
  <text x="700" y="175" font-family="monospace" font-size="7" fill="#34d399" text-anchor="middle" opacity="0.5">rooms · JWT auth</text>
  <text x="700" y="187" font-family="monospace" font-size="7" fill="#34d399" text-anchor="middle" opacity="0.35">typing indicators</text>

  <!-- Top label -->
  <text x="32" y="24" font-family="sans-serif" font-size="10" fill="#34d399" opacity="0.7" font-weight="600" letter-spacing="2">REAL-TIME · WEBSOCKETS · SOCKET.IO + NODE.JS</text>
</svg>
